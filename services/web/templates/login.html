<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — MSAi Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
  body.login-body {
    display: grid; place-items: center; background: var(--white); min-height: 100vh; padding: 20px;
  }
  .login-main {
    width: 100%; max-width: 440px; padding: 0; margin: 0;
  }
  .login-card {
    background: var(--card-bg); border-radius: 8px; padding: 36px; width: 100%;
  }
  .brand-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
  }
  .brand-header h1 {
    font-size: 24px; font-weight: 700; margin: 0;
  }
  .brand-header .eyebrow {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--black); text-transform: uppercase; margin-bottom: 2px;
  }
  .tabs {
    display: flex; gap: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--grey);
  }
  .tab {
    background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--black);
    font-weight: 700; margin: 0; min-height: auto; width: auto; padding: 4px 2px 10px; cursor: pointer; font-family: var(--font-main); font-size: 15px;
  }
  .tab:hover {
    opacity: 0.7;
  }
  .tab.active {
    border-bottom-color: var(--red);
  }
  label {
    margin: 16px 0 6px;
  }
  input {
    background: var(--white); border: 1px solid var(--grey); margin-bottom: 16px; outline: none; transition: border-color 0.2s ease;
  }
  input:focus {
    border-color: var(--blue);
  }
  button.go {
    background: var(--blue); margin-top: 8px; transition: background-color 0.2s ease;
  }
  button.go:hover {
    background: #3367d6;
  }
  .msg {
    font-size: 13px; margin-bottom: 16px; min-height: 18px; font-weight: 500;
  }
  .msg.err {
    color: var(--red);
  }
  .msg.ok {
    color: var(--green);
  }
  .note {
    margin-top: 28px; font-size: 12px; color: #5f6368; background: var(--white); border-left: 4px solid var(--yellow);
    border-radius: 4px; padding: 14px 16px; line-height: 1.5;
  }
</style>
</head>
<body class="login-body">
  <main class="login-main">
    <div class="login-card">
      <div class="brand-header">
        <img src="/static/logo.svg" alt="MSAi Manager logo" class="logo">
        <div>
          <span class="eyebrow">Google Cloud MSA Workspace</span>
          <h1>MSAi Manager</h1>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-login" onclick="show('login')">Sign in</button>
        <button class="tab" id="tab-register" onclick="show('register')">Register</button>
      </div>

      <div class="msg" id="msg"></div>

      <label for="email">Work email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="go" id="submit" onclick="submit()">Sign in</button>

      <div class="note">
        Your role is set automatically from your email domain — you can't choose it.
        This demo does not verify that you own the email address, so it must not be
        used with real customer data until email confirmation is added.
      </div>
    </div>
  </main>
  
<script>
let mode = "login";
function show(m){
  mode = m;
  document.getElementById("tab-login").classList.toggle("active", m==="login");
  document.getElementById("tab-register").classList.toggle("active", m==="register");
  document.getElementById("submit").textContent = m==="login" ? "Sign in" : "Create account";
  document.getElementById("password").autocomplete = m==="login" ? "current-password":"new-password";
  msg("", "");
}
function msg(text, kind){
  const el = document.getElementById("msg");
  el.textContent = text; el.className = "msg " + (kind||"");
}
async function submit(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !email.includes("@")){ msg("Enter a valid email.","err"); return; }
  if(!password){ msg("Enter your password.","err"); return; }
  const url = mode==="login" ? "/api/login" : "/api/register";
  try{
    const res = await fetch(url, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email, password})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ msg(data.error || "Something went wrong.","err"); return; }
    window.location.href = "/";        // into the app; session cookie is set
  }catch(e){ msg("Network error.","err"); }
}
</script>
</body>
</html>
